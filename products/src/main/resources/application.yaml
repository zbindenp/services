spring:
  application:
    name: products
  jpa:
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1
  datasource:
    url: jdbc:sqlserver://${DATABASE_HOST:localhost}:${DATABASE_PORT:1433};encrypt=false;trustServerCertificate=false;databaseName=${DATABASE_NAME:products}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:secure}
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port : ${APPLICATION_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_PORT:8081}

otel:
  logs:
    exporter: none
  instrumentation:
    spring-web:
      enabled: true
    logback-appender:
      enabled: true
      experimental:
        capture-mdc-attributes: '*'