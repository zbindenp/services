spring:
  application:
    name: main
main:
  productsbaseurl:  ${PRODUCTS_BASE_URL:http://localhost:8081}
  customersbaseurl: ${CUSTOMERS_BASE_URL:http://localhost:8082}
  loadbaseurl:      ${LOAD_BASE_URL:http://localhost:8083}
server:
  port : ${APPLICATION_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_PORT:8081}
otel:
  logs:
    exporter: none
#  metrics:
#    exporter: none
  instrumentation:
    spring-web:
      enabled: true
    logback-appender:
      enabled: true
      experimental:
        capture-mdc-attributes: '*'
  exporter:
    otlp:
      traces:
        endpoint: ${OTEL_COLLECTOR:http://localhost:4318}/v1/traces
      metrics:
        endpoint: ${OTEL_COLLECTOR:http://localhost:4318}/v1/metrics
