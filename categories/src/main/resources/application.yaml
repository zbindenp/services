spring:
  application:
    name: categories
  jpa:
    # generate-ddl: true
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
        generate_statistics: true
        jdbc:
          batch_size: 1000
        order_inserts: true
    show-sql: false
  datasource:
    url: jdbc:sqlserver://${DATABASE_HOST:localhost}:${DATABASE_PORT:1433};encrypt=false;trustServerCertificate=false;databaseName=${DATABASE_NAME:categories}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:secure}
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port : ${APPLICATION_PORT:8080}
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  server:
    port: 8091

otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  instrumentation:
    spring-web:
      enabled: true
    logback-appender:
      enabled: true
      experimental:
        capture-mdc-attributes: '*'
  exporter:
    otlp:
      traces:
        endpoint: ${OTEL_COLLECTOR:http://localhost:4318}/v1/traces
      metrics:
        endpoint: ${OTEL_COLLECTOR:http://localhost:4318}/v1/metrics

