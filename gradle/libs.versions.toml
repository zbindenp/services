[versions]
spring-boot = "3.5.16"
spring-boot4 = "4.1.0"
spring-dependency-management = "1.1.7"
flyway = "10.11.1"
logstash-encoder = "9.0"
graalvm-buildtools = "0.11.3"

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-sqlserver = { module = "org.flywaydb:flyway-sqlserver", version.ref = "flyway" }
logstash-encoder = { module='net.logstash.logback:logstash-logback-encoder', version.ref="logstash-encoder"}

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-boot4 = { id = "org.springframework.boot", version.ref = "spring-boot4" }
spring-dependecy-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
org-graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtools" }
