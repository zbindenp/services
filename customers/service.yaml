apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers
  namespace: demo
spec:
  selector:
    matchLabels:
      app: customers
  replicas: 3
  template:
    metadata:
      labels:
        app: customers
      annotations:
        deployed-at: "$DEPLOY"
    spec:
      containers:
        - name: customers
          image: "localhost:5000/services/customers:latest"
          imagePullPolicy: Always
          resources:
            requests:
              cpu: '0.3'
              memory: "512Mi"
            limits:
              cpu: '1'
              ephemeral-storage: "100Mi"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
              scheme: HTTP
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 9
          env:
            - name: DATABASE_HOST
              value: mssql-server.databases.svc.cluster.local
            - name: DATABASE_PORT
              value: "1433"
            - name: DATABASE_USERNAME
              value: serviceDbUser
            - name: DATABASE_PASSWORD
              value: myPassword01
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: demo
  labels:
    app: customers
spec:
  type: NodePort
  selector:
    app: customers
  ports:
    - name: "http"
      port: 8080 # Port wie der Service im kubernetes-cluster erreichbar ist. Default 8080
      targetPort: 8080 # Port welcher im Image verwendet wird. Default
