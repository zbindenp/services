namespace: "services"

mssql:
  saPassword: "myPassword4Services"
  nodePort: 31444
  databases:
    customers:
      user: "customersUser"
      password: "customersPwd@Home"
    products:
      user: "productsUser"
      password: "productsPwd@Homesdaswdaqwdswa"

defaults:
  registry: "localhost:5000"
  resources:
    requests:
      cpu: "0.2"
      memory: "512Mi"
    limits:
      cpu: "0.6"
      memory: "512Mi"
  ingress:
    domain: "example.com"

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 10
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 36

services:
  customers:
    name: "customers"
    replicaCount: 3
    cpuBoost: true
    image:
      repository: "services/customers"
    envFrom:
      - secretRef:
          name: customers-connection

  products:
    name: "products"
    replicaCount: 1
    cpuBoost: true
    image:
      repository: "services/products"
    envFrom:
      - secretRef:
          name: products-connection

  main:
    name: "main"
    replicaCount: 1
    image:
      repository: "services/main"
    resources:
      requests:
        cpu: "0.4"
        memory: "512Mi"
      limits:
        cpu: "0.4"
        memory: "512Mi"
    ingress:
      host: main
    env:
      - name: PRODUCTS_BASE_URL
        value: http://products-service.services.svc.cluster.local:8080
      - name: CUSTOMERS_BASE_URL
        value: http://customers-service.services.svc.cluster.local:8080
