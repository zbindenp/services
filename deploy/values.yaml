namespace: "services"

mssql:
  saPassword: "myPassword4Services"
  nodePort: 31444
  databases:
    customers:
      user: "customersUser"
    products:
      user: "productsUser"
      password: "productsPwd@Home"

defaults:
  registry: "localhost:5000"
  resources:
    requests:
      cpu: "0.2"
      memory: "512Mi"
    limits:
      cpu: "0.6"
      memory: "512Mi"
  ingress:
    domain: "example.com"

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 10
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 36


otel_collector_url: &otel_collector "http://services-otel.services.svc.cluster.local:4318"
otel:
  enabled: true
  mode: "deployment"
  image:
    repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector"
  config:
    receivers:
      zipkin: null
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    exporters:
      debug:
        verbosity: normal
      otlp:
        endpoint: "services-jaeger.services.svc.cluster.local:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          exporters: [ otlp, debug ]
          processors: [ batch ]
          receivers: [ otlp, jaeger ]
jaeger:
  enabled: true
  jaeger:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - jaeger.k8s.dev.sachi.ch

services:
  customers:
    name: "customers"
    replicaCount: 1
    cpuBoost: true
    labels:
      api: load
    image:
      repository: "services/customers"
    envFrom:
      - secretRef:
          name: customers-connection
    env:
      - name: OTEL_COLLECTOR
        value: *otel_collector

  products:
    name: "products"
    replicaCount: 1
    cpuBoost: true
    image:
      repository: "services/products"
    envFrom:
      - secretRef:
          name: products-connection
    env:
      - name: OTEL_COLLECTOR
        value: *otel_collector

  main:
    name: "main"
    replicaCount: 1
    image:
      repository: "services/main"
    resources:
      requests:
        cpu: "0.4"
        memory: "512Mi"
      limits:
        cpu: "1.2"
        memory: "512Mi"
    ingress:
      host: main
    env:
      - name: PRODUCTS_BASE_URL
        value: http://products-service.services.svc.cluster.local:8080
      - name: CUSTOMERS_BASE_URL
        value: http://customers-service.services.svc.cluster.local:8080
      - name: LOAD_BASE_URL
        value: http://load-service.services.svc.cluster.local:8080
      - name: OTEL_COLLECTOR
        value: *otel_collector


  load:
    name: "load"
    replicaCount: 3
    image:
      repository: "services/load"
    labels:
      api: load
    selector:
      api: load
    resources:
      requests:
        cpu: "0.05"
        memory: "128Mi"
      limits:
        cpu: "0.1"
        memory: "128Mi"
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        scheme: HTTP
      timeoutSeconds: 1
      periodSeconds: 20
      successThreshold: 1
      failureThreshold: 10
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
        scheme: HTTP
      timeoutSeconds: 10
      periodSeconds: 20
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /healthz
        port: 8080
        scheme: HTTP
      timeoutSeconds: 1
      periodSeconds: 2
      successThreshold: 1
      failureThreshold: 30
