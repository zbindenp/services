{{- if .Capabilities.APIVersions.Has "autoscaling.x-k8s.io/v1alpha1" }}
{{- range $name, $service := .Values.services }}
{{- if $service.cpuBoost | default false }}
apiVersion: autoscaling.x-k8s.io/v1alpha1
kind: StartupCPUBoost
metadata:
  name: {{ (printf "boost-%s" $name) | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    app: {{ $name | quote }}
selector:
  matchExpressions:
    - key: app
      operator: In
      values: [{{- $name | quote }}]
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $name | quote }}
        percentageIncrease:
          value: 50
  durationPolicy:
    podCondition:
      type: Ready
      status: "True"
---
{{- end }}
{{- end }}
{{- end }}